# Project definition (the iOS equivalent of build.gradle).
# XcodeGen turns this file into Masebha.xcodeproj on the CI machine.
# Never edit the generated .xcodeproj; change this file instead.
name: Masebha

options:
  bundleIdPrefix: nafii
  deploymentTarget:
    iOS: "17.0"
  # Arabic is the base language, like values/ on Android.
  developmentLanguage: ar
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "0.1.0"        # ≈ versionName
    CURRENT_PROJECT_VERSION: "1"      # ≈ versionCode
    SWIFT_VERSION: "6.0"              # Swift 6: data races are compile errors
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES

targets:
  Masebha:
    type: application
    platform: iOS
    sources:
      - path: Masebha
        excludes:
          - Info.plist   # referenced by INFOPLIST_FILE, must not be copied as a resource
    settings:
      base:
        PRODUCT_NAME: Masebha
        PRODUCT_BUNDLE_IDENTIFIER: nafii.masebha
        INFOPLIST_FILE: Masebha/Info.plist
        TARGETED_DEVICE_FAMILY: "1"   # iPhone only
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        # Everything runs on the main thread unless explicitly moved off it
        # (same mental model as the Android app, but checked by the compiler).
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        SWIFT_EMIT_LOC_STRINGS: YES

  MasebhaTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: MasebhaTests
    dependencies:
      - target: Masebha
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: nafii.masebha.tests
        GENERATE_INFOPLIST_FILE: YES
        # Unit tests run inside the app, so they can use its code and resources.
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Masebha.app/Masebha
        BUNDLE_LOADER: $(TEST_HOST)

  MasebhaUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: MasebhaUITests
    dependencies:
      - target: Masebha
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: nafii.masebha.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Masebha

schemes:
  Masebha:
    build:
      targets:
        Masebha: all
        MasebhaTests: [test]
        MasebhaUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - MasebhaTests
        - MasebhaUITests
    archive:
      config: Release
